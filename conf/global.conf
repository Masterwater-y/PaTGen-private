[global]
running_mode=collect
bench_mode=normalTest
scale=small
repeat_num=1
#node_ips=222.201.144.187,240.144.191.132
node_ips=222.201.144.200
[ibmc]

[collectors]
max_collected_time=99999999
# concat_method can be "left", "inner", "outer", "construct"
default_concat_method=outer
subcollector_default_concat_method=outer
main_network=auto
main_disk=sdc4
blktrace_interval=15
msprof_interval=60
collect_power=on
# raw profile 目录路径为 {tau_profile_path}/{task_id}_log/
tau_profile_path=/home/wgk/wgk/green_suite/raw_result/local_tau_data
task_id=9527

[connections]
# 用于 center 和 node 的连接配置

# center 获取 node 数据的时间间隔
warmup_interval=40
collect_interval=10

# node 的 ip 列表
# node_ips=controller2,compute1,compute2,compute3
#node_ips=222.201.144.187,240.144.191.132
node_ips=222.201.144.200
port=7001

# 当本机作为 node 时，collector 监听的端口
this_node_port=7001

[outputs]
# 性能计数器数据输出目录, 与 benchmark_runner/common.py 文件的相对路径
perf_output_dir=./result
